name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: linux }
          - { runner: windows-latest, target: windows }
          - { runner: macos-latest, target: macos }
    runs-on: ${{ matrix.runner }}
    env:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run setup:electron
      - run: bun run check
      - run: bun run test
      - name: fetch the pinned keywork sidecar and verify its SHA-256
        run: bun run fetch:sidecar
      - run: bun run --cwd packages/desktop build
      - name: signing is off until the certificate secrets exist
        if: ${{ matrix.target == 'macos' && env.MAC_CSC_LINK == '' }}
        run: echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
      - name: package ${{ matrix.target }} (signed and notarized only when the secrets are set)
        run: bun run --cwd packages/desktop pack
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: checksum every artifact
        shell: bash
        run: |
          cd packages/desktop/release
          rm -f builder-debug.yml
          for artifact in *.exe *.dmg *.AppImage *.deb; do
            [ -f "$artifact" ] || continue
            if command -v sha256sum > /dev/null; then sha256sum "$artifact" > "$artifact.sha256"
            else shasum -a 256 "$artifact" > "$artifact.sha256"; fi
          done
          ls -la
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keywork-app-${{ matrix.target }}
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.dmg
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
            packages/desktop/release/*.blockmap
            packages/desktop/release/*.yml
            packages/desktop/release/*.sha256
          if-no-files-found: error

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: keywork-app-*
          path: dist/release
          merge-multiple: true
      - name: verify every checksum and write SHA256SUMS
        run: |
          cd dist/release
          for sum in *.sha256; do sha256sum -c "$sum"; done
          cat *.sha256 > SHA256SUMS
          ls -la
      - name: the 60-second install clock (deb install to --version on a clean runner)
        run: |
          deb=$(ls dist/release/*.deb | head -n 1)
          start=$(date +%s%N)
          if sudo apt-get install -y "./$deb" > install.log 2>&1 \
            && timeout 60 /opt/keywork/keywork --no-sandbox --version > version.log 2>&1; then
            elapsed_ms=$(( ($(date +%s%N) - start) / 1000000 ))
            echo "install → --version took ${elapsed_ms}ms on a clean runner (budget: 60s); reported $(cat version.log)"
            if [ "$elapsed_ms" -gt 60000 ]; then
              echo "::error::the install clock exceeded 60s"
              exit 1
            fi
          else
            echo "::warning::the deb could not be installed and exercised headlessly on this runner; install clock not measured"
            cat install.log version.log 2> /dev/null || true
          fi
      - name: create the draft GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes \
            --repo "$GITHUB_REPOSITORY" \
            --title "keywork-app $GITHUB_REF_NAME" \
            dist/release/*
