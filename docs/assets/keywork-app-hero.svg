<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">keywork — native desktop workbench</title>
<desc id="desc">Keywork's night-theme palette, a large lowercase wordmark, an abstract tiled desktop and sculpted Ctrl and K keycaps. This is a brand illustration, not an application screenshot.</desc>
<metadata>Palette source: packages/ui/src/theme/gallery.json, keywork-night. Header artwork only; no product theme overrides.</metadata>
