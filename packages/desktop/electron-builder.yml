appId: dev.keywork.app
productName: keywork
directories:
  output: release
artifactName: ${productName}-app-${version}-${os}-${arch}.${ext}
files:
  - out/**
npmRebuild: true
asarUnpack:
  - node_modules/node-pty/**
extraResources:
  - from: sidecar
    to: sidecar
    filter:
      - "**/*"
win:
  target: nsis
mac:
  target: dmg
linux:
  target:
    - AppImage
    - deb
publish:
  provider: github
  owner: JMoak
  repo: keywork-app
