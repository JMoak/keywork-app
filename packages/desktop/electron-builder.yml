appId: dev.keywork.app
productName: keywork
executableName: keywork
directories:
  output: release
  buildResources: resources
artifactName: ${productName}-app-${version}-${os}-${arch}.${ext}
files:
  - out/**
npmRebuild: true
asarUnpack:
  - node_modules/node-pty/**
extraResources:
  - from: sidecar
    to: sidecar
    filter:
      - "**/*"
win:
  target: nsis
nsis:
  oneClick: true
  perMachine: false
  include: resources/installer.nsh
  shortcutName: keywork
  uninstallDisplayName: keywork
mac:
  target: dmg
linux:
  target:
    - AppImage
    - deb
publish:
  provider: github
  owner: JMoak
  repo: keywork-app
